<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Split scroll</title>
<style>
  :root { --bg: #000; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; } }
  :root[data-theme="dark"], :root[data-theme="light"] { --bg: #000; }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  html, body {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;   /* no "Save image" menu on long press */
    -webkit-user-select: none;
    user-select: none;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* Whole screen, edge to edge */
  .screen {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100vh;
    height: 100lvh;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 480px;      /* on desktop, show as a phone-width column */
    margin: 0 auto;
  }

  /* Top: fixed photo at full screen width, natural proportions */
  .fixed-pane { flex: 0 0 auto; position: relative; max-height: 60%; overflow: hidden; }
  .fixed-pane img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Bottom: fills the rest of the screen and scrolls */
  .scroll-pane {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    scrollbar-width: none;         /* hide scrollbar (Firefox) */
  }
  .scroll-pane::-webkit-scrollbar { display: none; }  /* hide scrollbar (Safari/Chrome) */
  img { -webkit-touch-callout: none; pointer-events: none; }
  .scroll-pane img {
    display: block;
    width: 100%;
    height: auto;
  }

  .swap {
    position: absolute; right: 10px; z-index: 2;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    font: 500 13px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #fff; background: rgba(0,0,0,.55);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    padding: 8px 12px; border-radius: 999px; cursor: pointer;
  }
  .scroll-pane { position: relative; }
  .scroll-pane .swap { position: sticky; float: right; top: 10px; right: auto; margin: 10px 10px -40px 0; }
  .swap input { display: none; }

  .swap, .version {
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  body.show-controls .swap, body.show-controls .version {
    opacity: 1;
    pointer-events: auto;
  }

  .version {
    position: absolute; left: 10px; bottom: 8px;
    font: 600 12px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #fff; background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 6px;
  }
</style>
</head>

<script>
  // iOS Home Screen mode reports a height that leaves out the status bar,
  // causing a black strip at the bottom. Use the real screen height instead.
  function fitToScreen() {
    const standalone = window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;
    if (!standalone) return;
    const portrait = window.matchMedia('(orientation: portrait)').matches;
    const h = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    document.querySelector('.screen').style.height = h + 'px';
    document.documentElement.style.height = h + 'px';
    document.body.style.height = h + 'px';
  }
  fitToScreen();
  window.addEventListener('resize', fitToScreen);
  window.addEventListener('orientationchange', () => setTimeout(fitToScreen, 300));

  // Long press anywhere (about half a second) shows the buttons; they hide again after 5 seconds.
  let pressTimer = null, hideTimer = null, startX = 0, startY = 0;
  function showControls() {
    document.body.classList.add('show-controls');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => document.body.classList.remove('show-controls'), 5000);
  }
  function cancelPress() { clearTimeout(pressTimer); pressTimer = null; }
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('.swap')) { showControls(); return; }   // tapping a button keeps them visible
    startX = e.clientX; startY = e.clientY;
    cancelPress();
    pressTimer = setTimeout(showControls, 550);
  });
  document.addEventListener('pointermove', e => {
    if (pressTimer && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) cancelPress(); // scrolling, not a long press
  });
  document.addEventListener('pointerup', cancelPress);
  document.addEventListener('pointercancel', cancelPress);
  document.addEventListener('contextmenu', e => e.preventDefault());

  // Change photo: swaps the picture on this device only (nothing is uploaded or saved)
  document.querySelectorAll('.swap input').forEach(input => {
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { document.getElementById(input.dataset.target).src = reader.result; };
      reader.readAsDataURL(file);
    });
  });
</script>
